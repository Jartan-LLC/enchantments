name: CI

on:
  pull_request:
    branches: [main]
  # Hook envs resolve at run time within their bounds, so `main` can go red with no
  # commit touching it; these catch that before the next PR does.
  push:
    branches: [main]
  schedule:
    - cron: "10 7 * * *" # daily, 07:10 UTC (offset from scorecard/link-check)
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      # `version-file` is required: without it this action installs uv `latest`,
      # not the ci/requirements.txt pin.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      # All file linters live in .pre-commit-config.yaml (the single source, shared
      # with `make lint`); pre-commit manages its own hook envs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-
      - run: uv pip install -r ci/requirements.txt
      - run: pre-commit run --all-files --show-diff-on-failure

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version-file: ci/requirements.txt
          enable-cache: true

      - run: uv pip install -r docs/requirements.txt
      - run: sphinx-build -W -b html docs docs/_build/html

  # All or nothing: consumer scenarios build their sibling Features from source, so a change
  # to one Feature re-runs every Feature that composes it.
  features:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # With no base (a manual run, a failed fetch) everything runs, rather than risk
      # skipping a change.
      - id: emit
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) git fetch -q --depth=1 origin "$BEFORE" && base=$BEFORE ;;
          esac
          ids=$(find src -mindepth 2 -maxdepth 2 -name devcontainer-feature.json -printf '%h\n' | cut -d/ -f2 | sort)
          if [ "$EVENT" = schedule ] || [ -z "${base:-}" ] \
              || git diff --name-only "$base" HEAD | grep -qE '^(src/|lib/|test/|package\.json$|package-lock\.json$|\.github/workflows/ci\.yml$|Makefile$)'; then
            matrix=$({ printf '%s\n' "$ids"; echo _global; } | jq -Rnc '[inputs | select(. != "")] as $ids
              | [$ids[] as $id | ("ubuntu-24.04", "ubuntu-24.04-arm") as $runner | {id: $id, runner: $runner}]')
          else
            matrix='[]'
          fi
          if [ "$EVENT" = schedule ] && [ -z "$ids" ]; then
            echo "::error::no Features found under src"
            exit 1
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.id }}, ${{ matrix.runner }})
    needs: features
    if: needs.features.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.features.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - env:
          ID: ${{ matrix.id }}
        run: .github/scripts/test-features.sh "$ID"

  vendor-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vendored helpers match lib/
        run: |
          make vendor
          drift=$(git status --porcelain -- src)
          if [ -n "$drift" ]; then
            echo "::error::a vendored helper differs from lib/; edit lib/, then run make vendor:"
            echo "$drift"
            exit 1
          fi

  readme-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Generated READMEs are committed and current
        run: |
          make readmes
          drift=$(git status --porcelain -- src)
          if [ -n "$drift" ]; then
            echo "::error::a generated README is missing or stale; run make readmes and commit:"
            echo "$drift"
            exit 1
          fi

  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      devcontainer: ${{ steps.diff.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # A PR's merge commit has its base as first parent. With no base (a manual run, a
      # failed fetch) the jobs run, rather than risk skipping a change.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) git fetch -q --depth=1 origin "$BEFORE" && base=$BEFORE ;;
          esac
          if [ -z "${base:-}" ] \
              || git diff --name-only "$base" HEAD | grep -q -e '^\.devcontainer/' -e '^\.github/workflows/ci\.yml$' -e '^Makefile$'; then
            echo devcontainer=true >>"$GITHUB_OUTPUT"
          fi

  liza-smoke:
    name: Liza smoke test
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .devcontainer/liza/install.sh
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bash .devcontainer/liza/smoke-test.sh

  devcontainer:
    name: Dev container (Liza ${{ matrix.activate && 'on' || 'off' }}, tools ${{ matrix.tools && 'on' || 'off' }})
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        activate: [true, false]
        tools: [true, false]
    # Read by devcontainer.json's ${localEnv:…} defaults, as a host override would be.
    env:
      ACTIVATE_LIZA: ${{ matrix.activate }}
      INSTALL_LIZA_TOOLS: ${{ matrix.tools }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The gha cache backend reads these; devcontainers/ci doesn't pass them to buildx.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ["ACTIONS_RUNTIME_TOKEN", "ACTIONS_RESULTS_URL", "ACTIONS_CACHE_URL", "ACTIONS_CACHE_SERVICE_V2"]) {
              if (process.env[name]) core.exportVariable(name, process.env[name]);
            }
      # The image is the same in every cell, so one cell writes the cache.
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          push: never
          cacheFrom: type=gha,scope=devcontainer
          cacheTo: ${{ matrix.activate && matrix.tools && 'type=gha,mode=max,scope=devcontainer' || '' }}
          runCmd: bash .devcontainer/verify.sh

  check:
    if: always()
    needs: [lint, docs, features, test, vendor-drift, readme-drift, changes, liza-smoke, devcontainer]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          results=("${{ needs.lint.result }}" "${{ needs.docs.result }}" "${{ needs.features.result }}" "${{ needs.test.result }}" "${{ needs.vendor-drift.result }}" "${{ needs.readme-drift.result }}" "${{ needs.changes.result }}" "${{ needs.liza-smoke.result }}" "${{ needs.devcontainer.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Check failed: $r"
              exit 1
            fi
          done
