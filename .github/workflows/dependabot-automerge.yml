name: Dependabot Automerge

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  automerge:
    runs-on: ubuntu-24.04
    # A GITHUB_TOKEN auto-merge starts no push run, so main's push run, which
    # retests every Feature after a merge, would skip a change under src/.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && !contains(github.head_ref, '/src/')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: fastify/github-action-merge-dependabot@73ec4cbb5e56df5591eae286972d5b2201ffe90f # v3.15.0
        with:
          target: minor
          merge-method: squash
          use-github-auto-merge: true
