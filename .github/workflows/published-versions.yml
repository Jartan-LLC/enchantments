name: Published versions

# Each Feature's highest published version, for the release PR; pin-bumps.yml
# calls it. A job of its own, so the npm packages the lookup runs never share
# a job with the App's token; release-pr.sh reads the result as data, and
# keeps only X.Y.Z values.
on:
  workflow_call:
    outputs:
      versions:
        description: '{"<id>": "X.Y.Z"}, from published-versions.sh'
        value: ${{ jobs.published.outputs.versions }}

permissions: {}

jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      packages: read # GHCR, should a package be private
    outputs:
      versions: ${{ steps.list.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - id: list
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          versions=$(.github/scripts/published-versions.sh)
          echo "Published: $versions"
          echo "versions=$versions" >>"$GITHUB_OUTPUT"
