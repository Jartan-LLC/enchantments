# markdownlint config — lints Markdown structure/consistency (Prettier is off for
# Markdown; this does NOT reformat). Tune rules to taste.
config:
  default: true
  MD013: false # line length — tables and prose legitimately run long
  MD024:
    siblings_only: true
  MD060: false # table-column-style — we deliberately don't auto-format tables
ignores:
  - "node_modules"
  - ".venv" # a worktree's or bare host's venv; its packages ship .md files
  - "docs/_build"
  - ".claude/workspace"
  - "AGENTS.md" # symlink to CLAUDE.md — lint the target, not the alias
  - ".github/PULL_REQUEST_TEMPLATE.md" # a fragment; starts with ## by design (MD041)
  - "src/*/README.md" # generated by `make docs`; CI checks it for drift
  - "docs/features/*.md" # include-only wrappers around each Feature's README
overrides:
  # A Feature's NOTES.md is appended under its generated README's heading.
  - filter: ["src/*/NOTES.md"]
    config:
      MD041: false
    combine: merge
